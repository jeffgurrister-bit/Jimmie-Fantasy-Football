# =============================================================================
#  MANAGER IDENTITY MAP  —  the one file in this project that is hand-authored
# =============================================================================
#
#  WHY THIS FILE EXISTS
#  --------------------
#  The spreadsheets identify managers by short first names ("Jimmie", "Josh",
#  "Yisha"). Those names collide: there are two Perkinses, two Joneses, two
#  Malaks and two Joshes in Risky Biscuit Brigade. Nothing in the source data
#  can tell us which "Josh" is which. If we guess wrong, all-time records and
#  championship counts get attributed to the wrong human — the most visible
#  possible way for this site to be wrong.
#
#  So every manager gets a stable `id` here, and every table in the database
#  keys off that id, never off a name string.
#
#  HOW THE SYNC USES IT
#  --------------------
#  * Every distinct team name in every source sheet MUST appear as an alias
#    below. If the sync meets a name it cannot resolve, it fails and tells you
#    which name and which sheet — it never invents a manager or drops a row.
#  * A manager with `confirmed: false` also fails the sync. Unconfirmed
#    identities are guesses, and guesses must not reach a public site.
#    Run with `--allow-unconfirmed` for local preview only; the site badges
#    those managers as provisional so nobody mistakes them for verified.
#
#  HOW TO EDIT IT  (this part is for Jimmie)
#  -----------------------------------------
#  1. Find the manager below.
#  2. Fix `canonical_name` / `display_name` if they're wrong.
#  3. Add any nickname the sheets use to `aliases` — exactly as it is spelled
#     in the sheet, including punctuation and capitalisation.
#  4. Change `confirmed: false` to `confirmed: true` once the name is right.
#  5. Save, then hit the sync button. See docs/HOW-TO-UPDATE.md.
#
#  Answering the questions marked  ### NEEDS JIMMIE ###  below is what unblocks
#  the first real load of the site. See docs/OPEN-QUESTIONS.md.
#
# =============================================================================

