# =============================================================================
#  MANAGER IDENTITY MAP  —  the one file in this project that is hand-authored
# =============================================================================
#
#  WHY THIS FILE EXISTS
#  --------------------
#  The spreadsheets identify managers by short first names ("Jimmie", "Josh",
#  "Yisha"), and those names collide badly. Across the two leagues there are:
#
#      two Perkinses  — Jimmie and Jim
#      two Malaks     — Jerry and Joe
#      three Joneses  — Josh, Austin and Nick
#      two Joshes     — Josh Jones and Josh Baker
#      two Joes       — Joe Malak and Joe G.
#      two Jonathans  — Jonathan Jawor (RBB) and Jonathan Barth (DM)
#      two Amezcuas   — Mike and Arturo (DM)
#
#  Nothing in the source data can tell these people apart. So every manager gets
#  a stable `id` here, and every table in the database keys off that id, never
#  off a name string.
#
#  HOW THE SYNC USES IT
#  --------------------
#  * Every distinct team name in every source sheet MUST appear as an alias
#    below. If the sync meets a name it cannot resolve, it fails and tells you
#    which name and which sheet — it never invents a manager or drops a row.
#  * One alias may only ever belong to one manager. Because lookup ignores case
#    and punctuation, "Joe G." and "joe g" count as the same alias — so the bare
#    first name goes to whoever the sheets actually use it for, and everyone else
#    gets their fuller name.
#  * A manager with `confirmed: false` fails the sync. Unconfirmed identities are
#    guesses, and guesses must not reach a public site. Run with
#    `--allow-unconfirmed` for local preview only; the site badges those managers
#    as provisional.
#
#  HOW TO EDIT IT  (this part is for Jimmie)
#  -----------------------------------------
#  1. Find the manager below.
#  2. Fix `canonical_name` / `display_name` if they're wrong.
#  3. Add any nickname the sheets use to `aliases` — exactly as it is spelled
#     in the sheet, including punctuation and capitalisation.
#  4. Change `confirmed: false` to `confirmed: true` once the name is right.
#  5. Save, then hit the sync button. See docs/HOW-TO-UPDATE.md.
#
#  `leagues` takes either shorthand or the full form:
#
#      leagues: [rbb]                        # active, no franchise
#      leagues:
#        - id: dm
#          active: false                     # retired from THIS league only
#          franchise: Orland Park Burnt Ends
#
#  Status is per league on purpose: Gil Smit still plays RBB and has retired from
#  Dyno Mites.
#
# =============================================================================

schema_version: 2

