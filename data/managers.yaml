unresolved:
  - id: q1-yisha-is-josh-baker
    blocks: [josh-jones, josh-baker]
    question: >
      Confirm outright that "Yisha" in the RBB sheets is Josh Baker, and that the
      bare "Josh" is Josh Jones. Jimmie's roster note says Josh Baker "might be
      Yisha in there", and every other source agrees — but this decides who owns
      the 2018 and 2022 championships, so it needs a definite yes rather than a
      "might".
