# Keeps the website's data in step with the commissioner's Google Sheet.
#
# HOW THE SITE STAYS CURRENT
# There is no live connection between the sheet and the website — the site is
# static files, and a visitor's page load never touches Google. Instead this job
# wakes up on a schedule, downloads the sheet, rebuilds the site's data file,
# commits it, and Vercel republishes from that commit.
#
# So the commissioner changes nothing about his routine. He edits his sheet as
# always; within a few hours the site has it.
#
# It also runs on demand: Actions -> "Update league data" -> Run workflow.
name: Update league data

on:
  schedule:
    # 13:00 UTC is about 7am in Chicago, where the league is. The first version ran
    # at 07:00 UTC, which is 1am there — so the failure email arrived in the middle
    # of the night. Times that produce mail should land during waking hours.
    #
    # Daily through the season, weekly out of it: the sheet does not change between
    # February and July, and 700 pointless runs a year is 700 chances to send a
    # spurious alert.
    - cron: '0 13 * 8-12,1 *'   # daily, August-January
    - cron: '0 13 * 2-7 1'      # Mondays, February-July
  push:
    paths:
      - 'data/workbook/*.xlsx'
      - 'data/managers.yaml'
  workflow_dispatch:

# One at a time: two overlapping runs would race to commit the same file.
concurrency:
  group: update-league-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup refuses to run when the
      # version is declared both here and as `packageManager` in package.json, and
      # it fails in seconds before anything else happens. package.json is the one
      # place that pins it, so the action reads it from there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the manager list is complete
        run: pnpm --filter @jff/sync check-managers

      - name: Find the workbook
        id: find
        run: |
          # Optional. It supplies lineup and draft detail, which is historical and
          # does not change week to week; the Google sheet supplies everything that
          # does. Newest .xlsx wins so a re-upload under a slightly different name
          # still works.
          book="$(ls -t data/workbook/*.xlsx 2>/dev/null | head -1 || true)"
          if [ -n "$book" ]; then echo "Using workbook $book"; else echo "No workbook — Google sheet only."; fi
          echo "book=$book" >> "$GITHUB_OUTPUT"

      - name: Rebuild the data from the Google sheets
        env:
          # Both must stay link-shared for this to work. Every source the snapshot
          # has belongs here: leaving one out does not fail, it writes a snapshot
          # with that section empty. The build refuses to do that now, so a missing
          # id shows up as a red run rather than as pages quietly vanishing.
          RBB_HISTORY_SHEET_ID: 1_jhoVbxloZG8lxDaDXMIkG7SEoKBfU1_2MBI4qSPRYg
          RBB_POWER_RANKINGS_SHEET_ID: 1YANpO-Mzht6FJpc93ul1jCHONEswHCp85Ah_rFskR4g
        run: |
          # The ids are read from the environment, so the only difference between
          # the two calls is the optional workbook.
          if [ -n "${{ steps.find.outputs.book }}" ]; then
            pnpm snapshot --file "${{ steps.find.outputs.book }}"
          else
            pnpm snapshot
          fi

      - name: Make sure the site still builds with the new data
        run: pnpm build

      - name: Commit the updated data
        run: |
          if git diff --quiet -- apps/rbb/data/snapshot.json; then
            echo "Nothing changed in the league data — no commit, no deployment."
            exit 0
          fi

          # The file carries the time it was generated, so it differs on every run
          # even when not one number moved. Comparing the whole file would therefore
          # commit and redeploy the site daily forever. Compare with that field
          # removed, and treat a timestamp-only change as no change.
          data() { jq -S 'del(.generatedAt)' "$1" | sha256sum | cut -d' ' -f1; }
          git show HEAD:apps/rbb/data/snapshot.json > /tmp/previous.json
          if [ "$(data /tmp/previous.json)" = "$(data apps/rbb/data/snapshot.json)" ]; then
            git checkout -- apps/rbb/data/snapshot.json
            echo "Only the build timestamp changed — no commit, no deployment."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rbb/data/snapshot.json
          git commit -m "Update league data from the Google sheet"
          git push
